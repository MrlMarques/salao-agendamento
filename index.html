<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salão Teste - Agendamento Online</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#7e22ce',
                        primaryHover: '#6b21a8',
                        bgMain: '#f3f4f6',
                        textMain: '#1f2937',
                        textSecondary: '#6b7280',
                        borderMain: '#e5e7eb'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .accordion-content {
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }
        .accordion-item.active .accordion-content {
            max-height: 1000px;
            opacity: 1;
        }
        .accordion-item .fa-chevron-up {
            transition: transform 0.3s;
        }
        .accordion-item.active .fa-chevron-up {
            transform: rotate(180deg);
        }
    </style>
</head>
<body class="bg-bgMain text-textMain font-sans antialiased pb-24">

    <!-- Header Fixo -->
    <header class="bg-white border-b border-borderMain sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-scissors text-xl text-primary"></i>
                <h1 class="text-lg font-bold text-textMain tracking-tight">Salão Teste</h1>
            </div>
            <div class="flex items-center space-x-4 text-primary">
                <i class="fab fa-whatsapp text-xl"></i>
                <i class="fab fa-instagram text-xl"></i>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-md w-full mx-auto p-4">
        
        <!-- ETAPA 1: Perfil do Estabelecimento (Substituído para Salão Teste com ícone de tesoura) -->
        <section id="step-professional" class="space-y-6">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-borderMain flex flex-col items-center text-center space-y-4">
                <div class="w-24 h-24 rounded-full bg-primary/10 border-4 border-white shadow-lg flex items-center justify-center text-primary text-4xl">
                    <i class="fa-solid fa-scissors"></i>
                </div>
                <div>
                    <h2 class="text-lg font-bold text-textMain">Salão Teste</h2>
                    <p class="text-xs text-textSecondary mt-1">Excelência em cortes, tratamentos e estilo para você.</p>
                </div>
                <button onclick="goToServices()" class="bg-primary hover:bg-primaryHover text-white text-xs font-bold py-3 px-6 rounded-full w-full transition shadow-md cursor-pointer">
                    Fazer Agendamento <i class="fa-solid fa-arrow-right ml-2"></i>
                </button>
            </div>
        </section>

        <!-- ETAPA 2: Seleção de Serviços (Acordeão) -->
        <section id="step-services" class="hidden space-y-4">
            <div class="flex items-center justify-between mb-2">
                <div>
                    <h2 class="text-sm font-bold uppercase text-textMain tracking-wider">Serviços Disponíveis</h2>
                    <p class="text-xs text-textSecondary">Selecione o serviço desejado</p>
                </div>
                <button onclick="backToHome()" class="text-xs text-primary font-medium"><i class="fa-solid fa-chevron-left mr-1"></i> Voltar</button>
            </div>

            <div id="accordion-container" class="space-y-3">
                <!-- Injetado via JavaScript -->
            </div>

            <div class="fixed bottom-0 left-0 right-0 p-4 bg-bgMain border-t border-borderMain shadow-inner z-40">
                <button id="btn-to-schedule" onclick="goToSchedule()" disabled class="w-full max-w-md mx-auto block bg-slate-300 text-slate-500 disabled:opacity-60 font-bold py-3 px-4 rounded-full transition duration-200 shadow-lg cursor-pointer disabled:cursor-not-allowed">
                    Continuar para Horários
                </button>
            </div>
        </section>

        <!-- ETAPA 3: Seleção de Data e Horário (5 horários de 1h a partir das 10:00) -->
        <section id="step-schedule" class="hidden space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-sm font-bold uppercase text-textMain tracking-wider">Escolha Data e Hora</h2>
                <button onclick="backToServices()" class="text-xs text-primary font-medium"><i class="fa-solid fa-chevron-left mr-1"></i> Voltar</button>
            </div>

            <!-- Seletor de Data -->
            <div class="bg-white p-4 rounded-2xl border border-borderMain shadow-sm">
                <label class="block text-xs text-textSecondary mb-2 font-medium">Data do Atendimento</label>
                <input type="date" id="appointment-date" onchange="loadAvailableSlots()" class="w-full bg-white border border-borderMain rounded-xl p-3 text-textMain text-sm focus:outline-none focus:border-primary">
            </div>

            <!-- Grade de Horários -->
            <div class="bg-white p-4 rounded-2xl border border-borderMain shadow-sm">
                <label class="block text-xs text-textSecondary mb-3 font-medium">Horários Disponíveis (10:00 às 15:00)</label>
                <div id="slots-grid" class="grid grid-cols-1 gap-2.5">
                    <!-- Injetado via JavaScript -->
                </div>
            </div>

            <button id="btn-to-client" onclick="goToClientData()" disabled class="w-full bg-primary hover:bg-primaryHover disabled:bg-slate-300 disabled:text-slate-500 text-white font-bold py-3.5 px-4 rounded-full transition duration-200 shadow-lg cursor-pointer disabled:cursor-not-allowed">
                Continuar para Dados
            </button>
        </section>

        <!-- ETAPA 4: Dados do Cliente e Envio para o WhatsApp -->
        <section id="step-client" class="hidden space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-sm font-bold uppercase text-textMain tracking-wider">Seus Dados</h2>
                <button onclick="backToSchedule()" class="text-xs text-primary font-medium"><i class="fa-solid fa-chevron-left mr-1"></i> Voltar</button>
            </div>

            <!-- Resumo -->
            <div class="bg-white border border-borderMain p-4 rounded-2xl text-xs space-y-2 text-textMain shadow-sm">
                <p class="flex justify-between"><span><i class="fa-solid fa-scissors text-primary mr-2"></i> Serviço:</span> <strong id="resume-service"></strong></p>
                <p class="flex justify-between"><span><i class="fa-solid fa-dollar-sign text-primary mr-2"></i> Valor:</span> <strong id="resume-price" class="text-primary text-sm"></strong></p>
                <p class="flex justify-between"><span><i class="fa-solid fa-calendar-alt text-primary mr-2"></i> Data/Hora:</span> <strong id="resume-datetime"></strong></p>
            </div>

            <!-- Formulário -->
            <div class="bg-white p-5 rounded-2xl border border-borderMain space-y-3 shadow-sm">
                <div>
                    <label class="block text-xs text-textSecondary mb-1 font-medium">Nome Completo</label>
                    <input type="text" id="client-name" placeholder="Digite seu nome" class="w-full bg-bgMain/50 border border-borderMain rounded-xl p-3 text-textMain text-sm focus:outline-none focus:border-primary">
                </div>
                <div>
                    <label class="block text-xs text-textSecondary mb-1 font-medium">WhatsApp</label>
                    <input type="tel" id="client-phone" placeholder="(12) 99999-9999" class="w-full bg-bgMain/50 border border-borderMain rounded-xl p-3 text-textMain text-sm focus:outline-none focus:border-primary">
                </div>
            </div>

            <button onclick="finalizeBooking()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 px-4 rounded-full transition duration-200 shadow-lg flex items-center justify-center space-x-2 cursor-pointer">
                <i class="fa-brands fa-whatsapp text-xl"></i>
                <span>Enviar Agendamento via WhatsApp</span>
            </button>
        </section>

    </main>

    <!-- Script de Lógica -->
    <script>
        const WHATSAPP_NUMBER = "5512991421077";

        // Categorias e Serviços fictícios para testes
        const categories = [
            {
                name: "Cabelo",
                services: [
                    { id: 1, name: "Corte Masculino Estilizado", description: "Corte moderno com acabamento na navalha e lavagem.", duration: "1h", price: 45.00 },
                    { id: 2, name: "Hidratação Capilar Profunda", description: "Tratamento de revitalização completa para os fios.", duration: "1h", price: 50.00 }
                ]
            },
            {
                name: "Barba e Acabamento",
                services: [
                    { id: 3, name: "Barba com Toalha Quente", description: "Modelagem de barba com vapor e toalha morna.", duration: "1h", price: 35.00 },
                    { id: 4, name: "Combo (Corte + Barba)", description: "Pacote completo para visual renovado.", duration: "1h", price: 70.00 }
                ]
            }
        ];

        // 5 Horários diários de hora em hora iniciando às 10:00
        const dailySlots = ["10:00", "11:00", "12:00", "13:00", "14:00"];

        let selectedService = null;
        let selectedDate = null;
        let selectedTime = null;

        window.onload = function() {
            renderCategories();
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('appointment-date').value = today;
            selectedDate = today;
        };

        function renderCategories() {
            const container = document.getElementById('accordion-container');
            container.innerHTML = categories.map((cat, catIdx) => `
                <div class="accordion-item bg-white border border-borderMain rounded-2xl overflow-hidden shadow-sm ${catIdx === 0 ? 'active' : ''}">
                    <button onclick="toggleAccordion(this)" class="w-full p-4 text-left font-bold text-textMain flex items-center justify-between bg-white hover:bg-slate-50 transition cursor-pointer">
                        <span>${cat.name}</span>
                        <i class="fa-solid fa-chevron-up text-xs text-textSecondary"></i>
                    </button>
                    <div class="accordion-content px-4 pb-4 space-y-2.5">
                        ${cat.services.map(s => `
                            <div onclick="selectService(${s.id})" id="service-card-${s.id}" class="service-card p-3 rounded-xl border border-borderMain cursor-pointer transition hover:border-primary flex items-center justify-between bg-bgMain/30">
                                <div class="pr-3">
                                    <h4 class="font-semibold text-xs text-textMain">${s.name}</h4>
                                    <p class="text-[11px] text-textSecondary mt-0.5">${s.description}</p>
                                    <span class="inline-block mt-1 text-[11px] font-bold text-primary">${s.duration} - R$ ${s.price.toFixed(2)}</span>
                                </div>
                                <div class="w-5 h-5 rounded-full border-2 border-slate-300 flex items-center justify-center shrink-0">
                                    <div class="inner-dot w-2.5 h-2.5 rounded-full bg-primary hidden"></div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function toggleAccordion(btn) {
            const item = btn.parentElement;
            item.classList.toggle('active');
        }

        function selectService(id) {
            // Achar o serviço em qualquer categoria
            let found = null;
            categories.forEach(c => {
                const s = c.services.find(item => item.id === id);
                if (s) found = s;
            });
            if (!found) return;

            selectedService = found;

            // Resetar estilos visuais dos cards
            document.querySelectorAll('.service-card').forEach(card => {
                card.classList.remove('border-primary', 'bg-primary/5');
                card.querySelector('.inner-dot').classList.add('hidden');
            });

            const activeCard = document.getElementById(`service-card-${id}`);
            activeCard.classList.add('border-primary', 'bg-primary/5');
            activeCard.querySelector('.inner-dot').classList.remove('hidden');

            document.getElementById('btn-to-schedule').removeAttribute('disabled');
            document.getElementById('btn-to-schedule').classList.remove('bg-slate-300', 'text-slate-500');
            document.getElementById('btn-to-schedule').classList.add('bg-primary', 'text-white');
        }

        function goToServices() {
            document.getElementById('step-professional').classList.add('hidden');
            document.getElementById('step-services').classList.remove('hidden');
        }

        function backToHome() {
            document.getElementById('step-services').classList.add('hidden');
            document.getElementById('step-professional').classList.remove('hidden');
        }

        function goToSchedule() {
            if (!selectedService) return;
            document.getElementById('step-services').classList.add('hidden');
            document.getElementById('step-schedule').classList.remove('hidden');
            loadAvailableSlots();
        }

        function backToServices() {
            document.getElementById('step-schedule').classList.add('hidden');
            document.getElementById('step-services').classList.remove('hidden');
        }

        function loadAvailableSlots() {
            const dateInput = document.getElementById('appointment-date');
            selectedDate = dateInput.value;
            selectedTime = null;
            document.getElementById('btn-to-client').setAttribute('disabled', 'true');

            // Carregar horários reservados do localStorage para esta data
            const storageKey = `salao_teste_${selectedDate}`;
            const bookedSlots = JSON.parse(localStorage.getItem(storageKey)) || [];

            const grid = document.getElementById('slots-grid');
            grid.innerHTML = dailySlots.map(time => {
                const isBooked = bookedSlots.includes(time);
                return `
                    <button onclick="selectTime('${time}')" id="slot-${time}" ${isBooked ? 'disabled' : ''} class="w-full py-3 px-4 rounded-xl text-sm font-medium transition flex items-center justify-between border ${
                        isBooked 
                        ? 'bg-slate-100 border-slate-200 text-slate-400 cursor-not-allowed line-through' 
                        : 'bg-white border-borderMain text-textMain hover:border-primary cursor-pointer'
                    }">
                        <span><i class="fa-regular fa-clock mr-2 text-primary"></i>${time}</span>
                        <span class="text-xs ${isBooked ? 'text-rose-500 font-bold' : 'text-emerald-600 font-semibold'}">${isBooked ? 'Ocupado' : 'Disponível'}</span>
                    </button>
                `;
            }).join('');
        }

        function selectTime(time) {
            selectedTime = time;

            dailySlots.forEach(t => {
                const btn = document.getElementById(`slot-${t}`);
                if (!btn.disabled) {
                    btn.classList.remove('border-primary', 'bg-primary/5');
                }
            });

            const activeBtn = document.getElementById(`slot-${time}`);
            activeBtn.classList.add('border-primary', 'bg-primary/5');

            document.getElementById('btn-to-client').removeAttribute('disabled');
        }

        function goToClientData() {
            if (!selectedTime) return;

            document.getElementById('resume-service').innerText = selectedService.name;
            document.getElementById('resume-price').innerText = `R$ ${selectedService.price.toFixed(2)}`;
            
            const formattedDate = selectedDate.split('-').reverse().join('/');
            document.getElementById('resume-datetime').innerText = `${formattedDate} às ${selectedTime}`;

            document.getElementById('step-schedule').classList.add('hidden');
            document.getElementById('step-client').classList.remove('hidden');
        }

        function backToSchedule() {
            document.getElementById('step-client').classList.add('hidden');
            document.getElementById('step-schedule').classList.remove('hidden');
        }

        function finalizeBooking() {
            const name = document.getElementById('client-name').value.trim();
            const phone = document.getElementById('client-phone').value.trim();

            if (!name || !phone) {
                alert('Por favor, preencha seu Nome e WhatsApp.');
                return;
            }

            // Salvar no localStorage para bloquear o horário
            const storageKey = `salao_teste_${selectedDate}`;
            const bookedSlots = JSON.parse(localStorage.getItem(storageKey)) || [];
            if (!bookedSlots.includes(selectedTime)) {
                bookedSlots.push(selectedTime);
                localStorage.setItem(storageKey, JSON.stringify(bookedSlots));
            }

            // Montar mensagem para o WhatsApp especificado (12991421077)
            const formattedDate = selectedDate.split('-').reverse().join('/');
            const message = `Olá! Gostaria de confirmar meu agendamento no Salão Teste:%0A%0A` +
                            `👤 *Cliente:* ${name}%0A` +
                            `📱 *WhatsApp:* ${phone}%0A` +
                            `✂️ *Serviço:* ${selectedService.name}%0A` +
                            `💰 *Valor:* R$ ${selectedService.price.toFixed(2)}%0A` +
                            `📅 *Data:* ${formattedDate}%0A` +
                            `⏰ *Horário:* ${selectedTime}%0A%0A` +
                            `Aguardando confirmação!`;

            const whatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${message}`;
            window.open(whatsappUrl, '_blank');

            alert('Agendamento processado! Redirecionando para o WhatsApp.');
            location.reload();
        }
    </script>
</body>
</html>
