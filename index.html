<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salão Teste - Agendamento Online</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #000000 !important;
            color: #ffffff !important;
        }
        .custom-card {
            background-color: #121212 !important;
            border-color: #27272a !important;
        }
        .custom-input {
            background-color: #000000 !important;
            color: #ffffff !important;
            border-color: #27272a !important;
        }
        .service-item {
            background-color: #000000 !important;
            border-color: #27272a !important;
            transition: all 0.2s ease-in-out;
        }
        .service-item.selected {
            border-color: #ec4899 !important;
            background-color: #1a0b14 !important;
        }
        .service-item.selected .radio-circle {
            border-color: #ec4899 !important;
            background-color: #ec4899 !important;
        }
        .accordion-content {
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }
        .accordion-item.active .accordion-content {
            max-height: 1000px;
            opacity: 1;
        }
        .accordion-item .fa-chevron-up {
            transition: transform 0.3s;
        }
        .accordion-item.active .fa-chevron-up {
            transform: rotate(180deg);
        }
    </style>
</head>
<body class="font-sans antialiased pb-24">

    <!-- Header Fixo -->
    <header class="custom-card border-b sticky top-0 z-50 shadow-md">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-full custom-card border flex items-center justify-center text-pink-500 shadow-sm">
                    <i class="fa-solid fa-scissors"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold text-white tracking-tight">Salão Teste</h1>
                    <p class="text-[10px] text-zinc-400">Agendamento Profissional</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="openAdminModal()" class="text-xs bg-zinc-900 border border-zinc-700 text-pink-500 px-3 py-1.5 rounded-xl font-bold hover:bg-zinc-800 transition cursor-pointer">
                    <i class="fa-solid fa-lock mr-1"></i> Painel
                </button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-md w-full mx-auto p-4 space-y-4">
        
        <!-- ETAPA 1: Serviços Disponíveis -->
        <section id="step-services" class="space-y-4">
            <div class="custom-card border p-4 rounded-2xl flex items-center space-x-3 shadow-sm">
                <div class="text-pink-500 text-2xl">
                    <i class="fa-solid fa-hand-sparkles"></i>
                </div>
                <div>
                    <h2 class="text-xs font-bold uppercase tracking-wider text-white">Serviços Disponíveis</h2>
                    <p class="text-[11px] text-zinc-400">Selecione o procedimento desejado abaixo</p>
                </div>
            </div>

            <!-- Acordeão de Categorias e Serviços -->
            <div id="accordion-container" class="space-y-3">
                <!-- Injetado via JavaScript -->
            </div>

            <!-- Botão Flutuante Continuar -->
            <div class="fixed bottom-0 left-0 right-0 p-4 bg-black/95 backdrop-blur-md border-t border-zinc-900 shadow-2xl z-40">
                <button id="btn-to-schedule" onclick="goToSchedule()" disabled class="w-full max-w-md mx-auto block bg-zinc-900 text-zinc-600 font-bold py-3.5 px-4 rounded-full transition duration-200 shadow-md cursor-not-allowed border border-zinc-800">
                    Continuar para Horários
                </button>
            </div>
        </section>

        <!-- ETAPA 2: Seleção de Data e Horário -->
        <section id="step-schedule" class="hidden space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-xs font-bold uppercase tracking-wider text-white">Escolha Data e Hora</h2>
                <button onclick="backToServices()" class="text-xs text-pink-500 font-bold flex items-center cursor-pointer"><i class="fa-solid fa-chevron-left mr-1"></i> Voltar</button>
            </div>

            <!-- Seletor de Data -->
            <div class="custom-card p-4 rounded-2xl border shadow-sm">
                <label class="block text-xs text-zinc-400 mb-2 font-medium">Data do Atendimento</label>
                <input type="date" id="appointment-date" onchange="loadAvailableSlots()" class="w-full custom-input border rounded-xl p-3 text-sm focus:outline-none focus:border-pink-500">
            </div>

            <!-- Grade de Horários -->
            <div class="custom-card p-4 rounded-2xl border shadow-sm">
                <label class="block text-xs text-zinc-400 mb-3 font-medium">Horários Disponíveis (10:00 às 15:00)</label>
                <div id="slots-grid" class="grid grid-cols-1 gap-2.5">
                    <!-- Injetado via JavaScript -->
                </div>
            </div>

            <button id="btn-to-client" onclick="goToClientData()" disabled class="w-full bg-pink-500 hover:bg-pink-600 disabled:bg-zinc-900 disabled:text-zinc-600 text-white font-bold py-3.5 px-4 rounded-full transition duration-200 shadow-lg cursor-not-allowed border border-zinc-800">
                Continuar para Dados
            </button>
        </section>

        <!-- ETAPA 3: Dados do Cliente e Envio para o WhatsApp -->
        <section id="step-client" class="hidden space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-xs font-bold uppercase tracking-wider text-white">Seus Dados</h2>
                <button onclick="backToSchedule()" class="text-xs text-pink-500 font-bold flex items-center cursor-pointer"><i class="fa-solid fa-chevron-left mr-1"></i> Voltar</button>
            </div>

            <!-- Resumo -->
            <div class="custom-card border p-4 rounded-2xl text-xs space-y-2 text-white shadow-sm">
                <p class="flex justify-between"><span><i class="fa-solid fa-scissors text-pink-500 mr-2"></i> Serviço:</span> <strong id="resume-service"></strong></p>
                <p class="flex justify-between"><span><i class="fa-solid fa-dollar-sign text-pink-500 mr-2"></i> Valor:</span> <strong id="resume-price" class="text-pink-500 font-bold text-sm"></strong></p>
                <p class="flex justify-between"><span><i class="fa-solid fa-calendar-alt text-pink-500 mr-2"></i> Data/Hora:</span> <strong id="resume-datetime"></strong></p>
            </div>

            <!-- Formulário -->
            <div class="custom-card p-5 rounded-2xl border space-y-3 shadow-sm">
                <div>
                    <label class="block text-xs text-zinc-400 mb-1 font-medium">Nome Completo</label>
                    <input type="text" id="client-name" placeholder="Digite seu nome" class="w-full custom-input border rounded-xl p-3 text-sm focus:outline-none focus:border-pink-500">
                </div>
                <div>
                    <label class="block text-xs text-zinc-400 mb-1 font-medium">WhatsApp</label>
                    <input type="tel" id="client-phone" placeholder="(12) 99999-9999" class="w-full custom-input border rounded-xl p-3 text-sm focus:outline-none focus:border-pink-500">
                </div>
            </div>

            <button onclick="finalizeBooking()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 px-4 rounded-full transition duration-200 shadow-lg flex items-center justify-center space-x-2 cursor-pointer">
                <i class="fa-brands fa-whatsapp text-xl"></i>
                <span>Enviar Agendamento via WhatsApp</span>
            </button>
        </section>

    </main>

    <!-- MODAL DO PAINEL / PLANILHA DE AGENDAMENTOS -->
    <div id="admin-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="custom-card border w-full max-w-lg rounded-2xl p-5 space-y-4 shadow-2xl max-h-[90vh] flex flex-col">
            <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
                <h3 class="font-bold text-sm text-white flex items-center"><i class="fa-solid fa-table text-pink-500 mr-2"></i> Planilha de Agendamentos</h3>
                <button onclick="closeAdminModal()" class="text-zinc-400 hover:text-white text-base cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- Filtro de Data para o Admin -->
            <div class="flex space-x-2 items-center">
                <input type="date" id="admin-filter-date" onchange="loadAdminBookings()" class="w-full custom-input border rounded-xl p-2.5 text-xs focus:outline-none focus:border-pink-500">
            </div>

            <!-- Tabela Estilo Planilha -->
            <div class="overflow-y-auto flex-1 border border-zinc-800 rounded-xl">
                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="bg-zinc-900 text-zinc-400 border-b border-zinc-800">
                            <th class="p-2.5">Horário</th>
                            <th class="p-2.5">Cliente</th>
                            <th class="p-2.5">Serviço</th>
                            <th class="p-2.5 text-right">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body" class="divide-y divide-zinc-900">
                        <!-- Injetado via JS -->
                    </tbody>
                </table>
            </div>

            <div class="flex justify-between items-center pt-2">
                <button onclick="clearAllBookings()" class="text-[11px] text-rose-500 hover:underline cursor-pointer"><i class="fa-solid fa-trash mr-1"></i> Limpar Dados Salvos</button>
                <button onclick="closeAdminModal()" class="bg-pink-500 hover:bg-pink-600 text-white font-bold px-4 py-2 rounded-xl text-xs cursor-pointer">Fechar</button>
            </div>
        </div>
    </div>

    <!-- Script de Lógica -->
    <script>
        const WHATSAPP_NUMBER = "5512991421077";

        const categories = [
            {
                name: "Cabelo",
                services: [
                    { id: 1, name: "Corte Masculino Estilizado", description: "Corte moderno com acabamento na navalha e lavagem.", duration: "1h", price: 45.00 },
                    { id: 2, name: "Hidratação Capilar Profunda", description: "Tratamento de revitalização completa para os fios.", duration: "1h", price: 50.00 }
                ]
            },
            {
                name: "Barba e Acabamento",
                services: [
                    { id: 3, name: "Barba com Toalha Quente", description: "Modelagem de barba com vapor e toalha morna.", duration: "1h", price: 35.00 },
                    { id: 4, name: "Combo (Corte + Barba)", description: "Pacote completo para visual renovado.", duration: "1h", price: 70.00 }
                ]
            }
        ];

        const dailySlots = ["10:00", "11:00", "12:00", "13:00", "14:00"];

        let selectedService = null;
        let selectedDate = null;
        let selectedTime = null;

        window.onload = function() {
            renderCategories();
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('appointment-date').value = today;
            selectedDate = today;
        };

        function renderCategories() {
            const container = document.getElementById('accordion-container');
            container.innerHTML = categories.map((cat, catIdx) => `
                <div class="accordion-item custom-card border rounded-2xl overflow-hidden shadow-sm ${catIdx === 0 ? 'active' : ''}">
                    <button onclick="toggleAccordion(this)" class="w-full p-4 text-left font-bold text-white flex items-center justify-between custom-card hover:bg-zinc-900 transition cursor-pointer">
                        <span class="text-sm">${cat.name}</span>
                        <i class="fa-solid fa-chevron-up text-xs text-pink-500"></i>
                    </button>
                    <div class="accordion-content px-4 pb-4 space-y-2.5">
                        ${cat.services.map(s => `
                            <div onclick="selectService(${s.id})" id="service-card-${s.id}" class="service-item p-3 rounded-xl border cursor-pointer flex items-center justify-between">
                                <div class="pr-3">
                                    <h4 class="font-bold text-xs text-white">${s.name}</h4>
                                    <p class="text-[11px] text-zinc-400 mt-0.5">${s.description}</p>
                                    <span class="inline-block mt-1 text-[11px] font-bold text-pink-500">${s.duration} - R$ ${s.price.toFixed(2)}</span>
                                </div>
                                <div class="radio-circle w-5 h-5 rounded-full border-2 border-zinc-700 flex items-center justify-center shrink-0"></div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function toggleAccordion(btn) {
            const item = btn.parentElement;
            item.classList.toggle('active');
        }

        function selectService(id) {
            let found = null;
            categories.forEach(c => {
                const s = c.services.find(item => item.id === id);
                if (s) found = s;
            });
            if (!found) return;

            selectedService = found;

            document.querySelectorAll('.service-item').forEach(card => {
                card.classList.remove('selected');
            });

            const activeCard = document.getElementById(`service-card-${id}`);
            if (activeCard) {
                activeCard.classList.add('selected');
            }

            const btnContinue = document.getElementById('btn-to-schedule');
            btnContinue.removeAttribute('disabled');
            btnContinue.classList.remove('bg-zinc-900', 'text-zinc-600', 'cursor-not-allowed');
            btnContinue.classList.add('bg-pink-500', 'text-white', 'hover:bg-pink-600', 'cursor-pointer');
        }

        function goToSchedule() {
            if (!selectedService) return;
            document.getElementById('step-services').classList.add('hidden');
            document.getElementById('step-schedule').classList.remove('hidden');
            loadAvailableSlots();
        }

        function backToServices() {
            document.getElementById('step-schedule').classList.add('hidden');
            document.getElementById('step-services').classList.remove('hidden');
        }

        function loadAvailableSlots() {
            const dateInput = document.getElementById('appointment-date');
            selectedDate = dateInput.value;
            selectedTime = null;
            document.getElementById('btn-to-client').setAttribute('disabled', 'true');
            document.getElementById('btn-to-client').classList.add('cursor-not-allowed');

            const storageKey = `salao_teste_details_${selectedDate}`;
            const bookedList = JSON.parse(localStorage.getItem(storageKey)) || [];
            const bookedTimes = bookedList.map(item => item.time);

            const grid = document.getElementById('slots-grid');
            grid.innerHTML = dailySlots.map(time => {
                const isBooked = bookedTimes.includes(time);
                return `
                    <button onclick="selectTime('${time}')" id="slot-${time}" ${isBooked ? 'disabled' : ''} class="w-full py-3 px-4 rounded-xl text-sm font-medium transition flex items-center justify-between border ${
                        isBooked 
                        ? 'bg-zinc-950 border-zinc-900 text-zinc-700 cursor-not-allowed line-through' 
                        : 'bg-black border-zinc-800 text-white hover:border-pink-500 cursor-pointer'
                    }">
                        <span><i class="fa-regular fa-clock mr-2 text-pink-500"></i>${time}</span>
                        <span class="text-xs ${isBooked ? 'text-rose-500 font-bold' : 'text-emerald-500 font-semibold'}">${isBooked ? 'Ocupado' : 'Disponível'}</span>
                    </button>
                `;
            }).join('');
        }

        function selectTime(time) {
            selectedTime = time;

            dailySlots.forEach(t => {
                const btn = document.getElementById(`slot-${t}`);
                if (btn && !btn.disabled) {
                    btn.style.borderColor = "#27272a";
                    btn.style.backgroundColor = "#000000";
                }
            });

            const activeBtn = document.getElementById(`slot-${time}`);
            if (activeBtn) {
                activeBtn.style.borderColor = "#ec4899";
                activeBtn.style.backgroundColor = "#1a0b14";
            }

            const btnClient = document.getElementById('btn-to-client');
            btnClient.removeAttribute('disabled');
            btnClient.classList.remove('cursor-not-allowed');
        }

        function goToClientData() {
            if (!selectedTime) return;

            document.getElementById('resume-service').innerText = selectedService.name;
            document.getElementById('resume-price').innerText = `R$ ${selectedService.price.toFixed(2)}`;
            
            const formattedDate = selectedDate.split('-').reverse().join('/');
            document.getElementById('resume-datetime').innerText = `${formattedDate} às ${selectedTime}`;

            document.getElementById('step-schedule').classList.add('hidden');
            document.getElementById('step-client').classList.remove('hidden');
        }

        function backToSchedule() {
            document.getElementById('step-client').classList.add('hidden');
            document.getElementById('step-schedule').classList.remove('hidden');
        }

        function finalizeBooking() {
            const name = document.getElementById('client-name').value.trim();
            const phone = document.getElementById('client-phone').value.trim();

            if (!name || !phone) {
                alert('Por favor, preencha seu Nome e WhatsApp.');
                return;
            }

            const storageKeyDetails = `salao_teste_details_${selectedDate}`;
            const bookedList = JSON.parse(localStorage.getItem(storageKeyDetails)) || [];
            
            bookedList.push({
                time: selectedTime,
                name: name,
                phone: phone,
                service: selectedService.name,
                price: selectedService.price
            });
            localStorage.setItem(storageKeyDetails, JSON.stringify(bookedList));

            const formattedDate = selectedDate.split('-').reverse().join('/');
            const message = `Olá! Gostaria de confirmar meu agendamento no Salão Teste:%0A%0A` +
                            `👤 *Cliente:* ${name}%0A` +
                            `📱 *WhatsApp:* ${phone}%0A` +
                            `✂️ *Serviço:* ${selectedService.name}%0A` +
                            `💰 *Valor:* R$ ${selectedService.price.toFixed(2)}%0A` +
                            `📅 *Data:* ${formattedDate}%0A` +
                            `⏰ *Horário:* ${selectedTime}%0A%0A` +
                            `Aguardando confirmação!`;

            const whatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${message}`;
            window.open(whatsappUrl, '_blank');

            alert('Agendamento processado! Redirecionando para o WhatsApp.');
            location.reload();
        }

        // Funções do Painel Administrativo / Planilha
        function openAdminModal() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('admin-filter-date').value = today;
            document.getElementById('admin-modal').classList.remove('hidden');
            loadAdminBookings();
        }

        function closeAdminModal() {
            document.getElementById('admin-modal').classList.add('hidden');
        }

        function loadAdminBookings() {
            const filterDate = document.getElementById('admin-filter-date').value;
            const storageKeyDetails = `salao_teste_details_${filterDate}`;
            const bookedList = JSON.parse(localStorage.getItem(storageKeyDetails)) || [];

            const tbody = document.getElementById('admin-table-body');
            
            if (bookedList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-zinc-500">Nenhum agendamento para esta data.</td></tr>`;
                return;
            }

            tbody.innerHTML = bookedList.map((item, index) => `
                <tr class="hover:bg-zinc-900/50">
                    <td class="p-2.5 font-bold text-pink-500">${item.time}</td>
                    <td class="p-2.5">
                        <div class="font-medium text-white">${item.name}</div>
                        <div class="text-[10px] text-zinc-400">${item.phone}</div>
                    </td>
                    <td class="p-2.5 text-zinc-300">
                        <div>${item.service}</div>
                        <div class="text-[10px] text-zinc-500">R$ ${item.price.toFixed(2)}</div>
                    </td>
                    <td class="p-2.5 text-right">
                        <button onclick="removeBooking('${filterDate}', ${index})" class="text-rose-500 hover:text-rose-400 p-1 cursor-pointer"><i class="fa-solid fa-trash-can"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function removeBooking(date, index) {
            if (!confirm('Deseja cancelar/remover este agendamento?')) return;
            const storageKeyDetails = `salao_teste_details_${date}`;
            let bookedList = JSON.parse(localStorage.getItem(storageKeyDetails)) || [];
            
            bookedList.splice(index, 1);
            localStorage.setItem(storageKeyDetails, JSON.stringify(bookedList));
            loadAdminBookings();
        }

        function clearAllBookings() {
            if (!confirm('Deseja limpar todos os dados salvos deste dia?')) return;
            const filterDate = document.getElementById('admin-filter-date').value;
            localStorage.removeItem(`salao_teste_details_${filterDate}`);
            loadAdminBookings();
        }
    </script>
</body>
</html>
