<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Hair - Agendamento Online</title>
    <!-- Tailwind CSS para estilização moderna -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 text-center shadow-md">
        <h1 class="text-xl font-bold tracking-wide text-amber-400">
            <i class="fa-solid fa-scissors mr-2"></i>Studio Hair & Style
        </h1>
        <p class="text-xs text-slate-400 mt-1">Agende seu horário de forma rápida e prática</p>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-md w-full mx-auto p-4 flex-grow">
        
        <!-- ETAPA 1: Seleção de Serviços -->
        <section id="step-services" class="space-y-4">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">1. Escolha o Serviço</h2>
            <div id="services-list" class="space-y-3">
                <!-- Os serviços serão injetados via JS -->
            </div>
            <button id="btn-to-schedule" onclick="goToSchedule()" disabled class="w-full mt-4 bg-amber-500 hover:bg-amber-400 disabled:bg-slate-700 disabled:text-slate-500 text-slate-950 font-bold py-3 px-4 rounded-xl transition duration-200 shadow-lg cursor-pointer disabled:cursor-not-allowed">
                Continuar para Horários <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
        </section>

        <!-- ETAPA 2: Seleção de Data e Horário -->
        <section id="step-schedule" class="hidden space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">2. Escolha Data e Horário</h2>
                <button onclick="backToServices()" class="text-xs text-amber-400 hover:underline"><i class="fa-solid fa-arrow-left mr-1"></i> Voltar</button>
            </div>
            
            <!-- Seletor de Data -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <label class="block text-xs text-slate-400 mb-1 font-medium">Data do Atendimento</label>
                <input type="date" id="appointment-date" onchange="loadAvailableSlots()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 text-sm focus:outline-none focus:border-amber-400">
            </div>

            <!-- Grade de Horários -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <label class="block text-xs text-slate-400 mb-2 font-medium">Horários Disponíveis (10h às 15h)</label>
                <div id="slots-grid" class="grid grid-cols-1 gap-2">
                    <!-- Horários injetados via JS -->
                </div>
            </div>

            <button id="btn-to-client" onclick="goToClientData()" disabled class="w-full bg-amber-500 hover:bg-amber-400 disabled:bg-slate-700 disabled:text-slate-500 text-slate-950 font-bold py-3 px-4 rounded-xl transition duration-200 shadow-lg cursor-pointer disabled:cursor-not-allowed">
                Continuar para Dados <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
        </section>

        <!-- ETAPA 3: Dados do Cliente e Confirmação -->
        <section id="step-client" class="hidden space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">3. Seus Dados</h2>
                <button onclick="backToSchedule()" class="text-xs text-amber-400 hover:underline"><i class="fa-solid fa-arrow-left mr-1"></i> Voltar</button>
            </div>

            <!-- Resumo do Pedido -->
            <div class="bg-slate-800/60 border border-slate-700/80 p-3 rounded-xl text-xs space-y-1 text-slate-300">
                <p><strong class="text-slate-400">Serviço:</strong> <span id="resume-service" class="text-amber-400 font-medium"></span></p>
                <p><strong class="text-slate-400">Valor:</strong> <span id="resume-price" class="text-emerald-400 font-medium"></span></p>
                <p><strong class="text-slate-400">Data/Hora:</strong> <span id="resume-datetime" class="text-slate-100 font-medium"></span></p>
            </div>

            <!-- Formulário -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1 font-medium">Nome Completo</label>
                    <input type="text" id="client-name" placeholder="Digite seu nome" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 text-sm focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1 font-medium">WhatsApp</label>
                    <input type="tel" id="client-phone" placeholder="(12) 99999-9999" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 text-sm focus:outline-none focus:border-amber-400">
                </div>
            </div>

            <button onclick="finalizeBooking()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 px-4 rounded-xl transition duration-200 shadow-lg flex items-center justify-center space-x-2 cursor-pointer">
                <i class="fa-brands fa-whatsapp text-xl"></i>
                <span>Enviar Agendamento via WhatsApp</span>
            </button>
        </section>

    </main>

    <!-- Footer / Rodapé -->
    <footer class="text-center py-4 text-xs text-slate-500 border-t border-slate-800">
        &copy; 2026 Studio Hair & Style. Todos os direitos reservados.
    </footer>

    <!-- Lógica da Aplicação -->
    <script>
        // Configuração e Dados de Teste
        const WHATSAPP_NUMBER = "5512991421077";
        
        const services = [
            { id: 1, name: "Corte Masculino Estilizado", description: "Corte moderno com acabamento na navalha e lavagem.", price: 45.00 },
            { id: 2, name: "Barba Completa com Toalha Quente", description: "Modelagem de barba com vapor de ozônio e toalha morna.", price: 35.00 },
            { id: 3, name: "Combo (Corte + Barba)", description: "O pacote completo para o seu visual renovado.", price: 70.00 },
            { id: 4, name: "Hidratação e Estética Capilar", description: "Tratamento profundo para revitalização dos fios.", price: 50.00 }
        ];

        // 5 Horários diários exigidos (10:00, 11:00, 12:00, 13:00, 14:00 ou similar de 1h)
        const dailySlots = ["10:00", "11:00", "12:00", "13:00", "14:00"];

        // Estado Global da Aplicação
        let selectedService = null;
        let selectedDate = null;
        let selectedTime = null;

        // Inicialização
        window.onload = function() {
            renderServices();
            
            // Definir a data mínima como hoje no input de data
            const today = new Date().toISOString().split('T')[0];
            const dateInput = document.getElementById('appointment-date');
            dateInput.value = today;
            selectedDate = today;
        };

        // Renderizar lista de serviços
        function renderServices() {
            const container = document.getElementById('services-list');
            container.innerHTML = services.map(service => `
                <div onclick="selectService(${service.id})" id="service-card-${service.id}" class="service-card bg-slate-800 border border-slate-700 p-3.5 rounded-xl cursor-pointer transition hover:border-amber-400 flex items-center justify-between">
                    <div>
                        <h3 class="font-semibold text-slate-200 text-sm">${service.name}</h3>
                        <p class="text-xs text-slate-400 mt-0.5">${service.description}</p>
                        <span class="inline-block mt-2 text-xs font-bold text-amber-400">R$ ${service.price.toFixed(2)}</span>
                    </div>
                    <div class="radio-indicator w-5 h-5 rounded-full border-2 border-slate-600 flex items-center justify-center">
                        <div class="inner-dot w-2.5 h-2.5 rounded-full bg-amber-400 hidden"></div>
                    </div>
                </div>
            `).join('');
        }

        function selectService(id) {
            selectedService = services.find(s => s.id === id);
            
            // Atualizar classes visuais dos cards
            document.querySelectorAll('.service-card').forEach(card => {
                card.classList.remove('border-amber-400', 'bg-slate-750');
                card.querySelector('.inner-dot').classList.add('hidden');
                card.querySelector('.radio-indicator').classList.remove('border-amber-400');
            });

            const activeCard = document.getElementById(`service-card-${id}`);
            activeCard.classList.add('border-amber-400');
            activeCard.querySelector('.inner-dot').classList.remove('hidden');
            activeCard.querySelector('.radio-indicator').classList.add('border-amber-400');

            // Habilitar botão de continuar
            document.getElementById('btn-to-schedule').removeAttribute('disabled');
        }

        function goToSchedule() {
            if (!selectedService) return;
            document.getElementById('step-services').classList.add('hidden');
            document.getElementById('step-schedule').classList.remove('hidden');
            loadAvailableSlots();
        }

        function backToServices() {
            document.getElementById('step-schedule').classList.add('hidden');
            document.getElementById('step-services').classList.remove('hidden');
        }

        // Carregar horários e verificar bloqueios salvos no localStorage
        function loadAvailableSlots() {
            const dateInput = document.getElementById('appointment-date');
            selectedDate = dateInput.value;
            selectedTime = null;
            document.getElementById('btn-to-client').setAttribute('disabled', 'true');

            // Chave de armazenamento por data: ex: "appointments_2026-06-07"
            const storageKey = `appointments_${selectedDate}`;
            const bookedSlots = JSON.parse(localStorage.getItem(storageKey)) || [];

            const grid = document.getElementById('slots-grid');
            grid.innerHTML = dailySlots.map(time => {
                const isBooked = bookedSlots.includes(time);
                return `
                    <button onclick="selectTime('${time}')" id="slot-${time}" ${isBooked ? 'disabled' : ''} class="w-full py-2.5 px-4 rounded-lg text-sm font-medium transition flex items-center justify-between border ${
                        isBooked 
                        ? 'bg-slate-900 border-slate-800 text-slate-600 cursor-not-allowed line-through' 
                        : 'bg-slate-900 border-slate-700 text-slate-200 hover:border-amber-400 cursor-pointer'
                    }">
                        <span><i class="fa-regular fa-clock mr-2 text-amber-400"></i>${time}</span>
                        <span class="text-xs ${isBooked ? 'text-rose-500 font-bold' : 'text-emerald-400'}">${isBooked ? 'Ocupado' : 'Disponível'}</span>
                    </button>
                `;
            }).join('');
        }

        function selectTime(time) {
            selectedTime = time;

            // Destacar horário escolhido
            dailySlots.forEach(t => {
                const btn = document.getElementById(`slot-${t}`);
                if (!btn.disabled) {
                    btn.classList.remove('border-amber-400', 'bg-amber-400/10');
                }
            });

            const activeBtn = document.getElementById(`slot-${time}`);
            activeBtn.classList.add('border-amber-400', 'bg-amber-400/10');

            document.getElementById('btn-to-client').removeAttribute('disabled');
        }

        function goToClientData() {
            if (!selectedTime) return;

            // Preencher resumo
            document.getElementById('resume-service').innerText = selectedService.name;
            document.getElementById('resume-price').innerText = `R$ ${selectedService.price.toFixed(2)}`;
            
            const formattedDate = selectedDate.split('-').reverse().join('/');
            document.getElementById('resume-datetime').innerText = `${formattedDate} às ${selectedTime}`;

            document.getElementById('step-schedule').classList.add('hidden');
            document.getElementById('step-client').classList.remove('hidden');
        }

        function backToSchedule() {
            document.getElementById('step-client').classList.add('hidden');
            document.getElementById('step-schedule').classList.remove('hidden');
        }

        // Finalizar agendamento: bloqueia o horário no storage e abre o WhatsApp
        function finalizeBooking() {
            const name = document.getElementById('client-name').value.trim();
            const phone = document.getElementById('client-phone').value.trim();

            if (!name || !phone) {
                alert('Por favor, preencha seu Nome e WhatsApp.');
                return;
            }

            // 1. Salvar o bloqueio do horário escolhido no localStorage
            const storageKey = `appointments_${selectedDate}`;
            const bookedSlots = JSON.parse(localStorage.getItem(storageKey)) || [];
            if (!bookedSlots.includes(selectedTime)) {
                bookedSlots.push(selectedTime);
                localStorage.setItem(storageKey, JSON.stringify(bookedSlots));
            }

            // 2. Montar mensagem formatada para o WhatsApp
            const formattedDate = selectedDate.split('-').reverse().join('/');
            const message = `Olá! Gostaria de confirmar meu agendamento no Studio Hair:%0A%0A` +
                            `👤 *Cliente:* ${name}%0A` +
                            `📱 *WhatsApp:* ${phone}%0A` +
                            `✂️ *Serviço:* ${selectedService.name}%0A` +
                            `💰 *Valor:* R$ ${selectedService.price.toFixed(2)}%0A` +
                            `📅 *Data:* ${formattedDate}%0A` +
                            `⏰ *Horário:* ${selectedTime}%0A%0A` +
                            `Aguardando confirmação!`;

            // 3. Abrir link do WhatsApp com o número especificado
            const whatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${message}`;
            window.open(whatsappUrl, '_blank');

            // Resetar fluxo ou avisar o usuário
            alert('Agendamento registrado com sucesso! Redirecionando para o WhatsApp do salão.');
            location.reload();
        }
    </script>
</body>
</html>
